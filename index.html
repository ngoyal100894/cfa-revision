<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="CFA Revision">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#fbf8f3" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#100f19" media="(prefers-color-scheme: dark)">
<title>CFA Revision</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800&display=swap">
<!-- Bump ?v= on every release so a phone never mixes a new app.js with a cached old app.css. -->
<link rel="stylesheet" href="app.css?v=1.6">
</head>
<body>
<div id="app" class="app">
  <div id="banner" class="banner" role="status" hidden></div>
  <main id="screen" class="screen" aria-live="polite"></main>
  <div id="toast" class="toast" role="status" hidden></div>
</div>
<div id="modal-root"></div>
<noscript><p style="padding:24px;font:17px system-ui">This app needs JavaScript to run.</p></noscript>
<script src="scheduler.js?v=1.6"></script>
<script src="app.js?v=1.6"></script>
</body>
</html>
